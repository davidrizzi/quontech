name: QuonTech - validated daily NAV

on:
  schedule:
    # 06:17 UTC = 07:17 in Lugano (winter time), after the previous US session has closed.
    - cron: '17 6 * * 2-6'   # Tue-Sat: one run per US session (Mon-Fri)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quontech-nav-refresh
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate portfolio and fetch closed-session data
        run: python scripts/update_portfolio.py
      - name: Check JSON and report whether it changed
        run: python -m json.tool data/portfolio_performance.json > /dev/null
      - name: Commit refreshed NAV only when validated data changed
        run: |
          git add data/portfolio_performance.json
          if git diff --cached --quiet; then
            echo 'No new close to publish.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update QuonTech validated daily NAV'
          git push
